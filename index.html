<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Energia 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mira"></div>

    <div id="placar">Pontos: <span id="pontos-txt">0</span></div>

    <div id="tela-pause" class="escondido">
        <div class="menu-caixa">
            <h2>JOGO PAUSADO</h2>
            <p>Pressione <strong>ESC</strong> ou clique para continuar</p>
        </div>
    </div>

    <div id="ui-container"></div>

    <div id="barra-boss-container" class="escondido">
        <div id="nome-boss">CHEFE</div>
        <div class="barra-vida-fundo">
            <div id="barra-boss-vida"></div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
